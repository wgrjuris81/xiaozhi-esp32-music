yaml
name: Build Xiaozhi Music LCD

on:
  workflow_dispatch:
    inputs:
      placa:
        description: 'Nome da placa com LCD'
        required: true
        default: 'bread-compact-wifi-lcd'
        type: choice
        options:
          - bread-compact-wifi-lcd
          - waveshare-esp32-s3-touch-lcd-1.54
          - waveshare-esp32-s3-lcd-1.54

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Official Release Script
        run: |
          set -e
          . /opt/esp/idf/export.sh
          pip install -q pyyaml
          echo "=== Placas disponíveis ==="
          find main/boards -maxdepth 2 -mindepth 1
          echo "=== Conteúdo de scripts/release.py ==="
          cat scripts/release.py || true
          echo "=== Iniciando build para: ${{ github.event.inputs.placa }} ==="
          python scripts/release.py "${{ github.event.inputs.placa }}"
          mkdir -p dist
          find . -maxdepth 3 \( -name "merged-binary.bin" -o -name "*.zip" \) -exec cp {} dist/ \;

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.inputs.placa }}
          path: dist/*
          if-no-files-found: error

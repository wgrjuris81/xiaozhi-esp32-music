name: Build Xiaozhi Music LCD

on:
  workflow_dispatch:
    inputs:
      placa:
        description: 'Escolha a placa com tela LCD'
        required: true
        default: 'bread-compact-wifi-lcd'
        type: choice
        options:
          - bread-compact-wifi-lcd
          - waveshare/esp32-s3-touch-lcd-1.54
          - waveshare/esp32-s3-lcd-1.54

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Direct IDF with LCD
        run: |
          set -e
          . /opt/esp/idf/export.sh
          PLACA="${{ github.event.inputs.placa }}"
          idf.py set-target esp32s3
          sed -i 's/CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI=y/# CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI is not set/g' sdkconfig
          BOARD_MACRO=$(echo "$PLACA" | tr '[:lower:]-/.' '[:upper:]___')
          echo "CONFIG_BOARD_TYPE_${BOARD_MACRO}=y" >> sdkconfig
          idf.py reconfigure
          idf.py build
          mkdir -p dist
          cp build/bootloader/bootloader.bin dist/
          cp build/partition_table/partition-table.bin dist/
          cp build/ota_data_initial.bin dist/ || true
          cp build/srmodels/srmodels.bin dist/ || true
          cp build/xiaozhi.bin dist/
          ls -lh dist/

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arquivos-gravacao-xiaozhi
          path: dist/*.bin
          if-no-files-found: error

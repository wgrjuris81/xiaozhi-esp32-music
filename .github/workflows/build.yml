name: Build Xiaozhi Firmware
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        run: |
          BOARD=$(ls main/boards | grep -E "waveshare.*1\.54|bread-compact-wifi-lcd" | head -n 1)
          echo "Compilando placa: $BOARD"
          python scripts/release.py "$BOARD"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xiaozhi-music
          path: "**/*.zip"

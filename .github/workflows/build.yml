name: Build muma
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Conferir arquivos
        run: |
          ls scripts
          ls main/boards/sp-esp32-s3-1.54-muma
          cat main/boards/sp-esp32-s3-1.54-muma/config.json
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          . $IDF_PATH/export.sh
          pip install -q pyyaml requests
          python scripts/release.py sp-esp32-s3-1.54-muma
      - name: Listar resultado
        if: always()
        run: ls -la releases build || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware
          if-no-files-found: warn
          path: |
            releases/
            build/flasher_args.json
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
